# FlowCapital Nginx 配置（HTTPS + HSTS）
# 用途: 反向代理 + 前端静态文件 + API 代理 + Edge 缓存 + SSL

proxy_cache_path /var/cache/nginx/flowcapital levels=1:2 keys_zone=api_cache:50m max_size=200m inactive=30m;

upstream api_backend {
    server 127.0.0.1:8001;
    keepalive 32;
}

# HTTP → HTTPS 301 重定向
server {
    listen 80;
    server_name flowcapital.cn 8.154.19.151;
    return 301 https://$host$request_uri;
}

# HTTPS 服务器
server {
    listen 443 ssl http2;
    server_name flowcapital.cn 8.154.19.151;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    # HSTS（第 1 周: 86400 → 第 2 周: 604800 → 第 4 周: 31536000）
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # 日志
    access_log /var/log/nginx/flowcapital-access.log;
    error_log  /var/log/nginx/flowcapital-error.log;

    # API 反向代理
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 服务端注入 API Key（避免前端 bundle 泄露）
        # 将 API_KEY 写入 /etc/nginx/conf.d/api_key.conf: set $api_key "YOUR_KEY";
        set $api_key "";
        include /etc/nginx/conf.d/api_key.conf;
        proxy_set_header X-API-Key $api_key;

        # 超时设置
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;   # GraphRAG/翻译等慢接口需要更长
        proxy_send_timeout 30s;

        # Edge 缓存: GET 请求缓存 15 分钟（爬虫间隔）
        proxy_cache api_cache;
        proxy_cache_key "$request_uri";
        proxy_cache_valid 200 15m;
        proxy_cache_valid 304 1h;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        add_header X-Cache-Status $upstream_cache_status;

        # 搜索/写操作/需认证端点不缓存
        set $nocache 0;
        if ($request_method != GET) { set $nocache 1; }
        if ($uri ~* "/search|/fresh|/admin|/login|/message|/graph-rag/info|/graph-rag/entity-timeline") { set $nocache 1; }
        proxy_no_cache $nocache;

        # 限流: 每 IP 最多 100 请求/秒, 突发 50（SPA 单页多请求）
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;
    }

    # 前端静态文件
    root /var/www/flowcapital;
    index index.html;

    location / {
        try_files /index.pre.html /index.html =404;
    }

    # 静态资源强缓存 (30 天)
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    # Service Worker（禁止缓存）
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 安全: 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}

# 限流区域定义
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;