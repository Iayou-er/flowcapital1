# FlowCapital Nginx 配置
# 用途: HTTPS 反向代理 + 前端静态文件 + API 代理 + Edge 缓存

proxy_cache_path /var/cache/nginx/flowcapital levels=1:2 keys_zone=api_cache:50m max_size=200m inactive=30m;

upstream api_backend {
    server 127.0.0.1:8001;
    keepalive 32;
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name your-domain.com www.your-domain.com;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # SSL 证书（certbot 自动配置）
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 日志
    access_log /var/log/nginx/flowcapital-access.log;
    error_log  /var/log/nginx/flowcapital-error.log;

    # API 反向代理
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 10s;

        # Edge 缓存: GET 请求缓存 15 分钟（爬虫间隔）
        proxy_cache api_cache;
        proxy_cache_key "$request_uri";
        proxy_cache_valid 200 15m;
        proxy_cache_valid 304 1h;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        add_header X-Cache-Status $upstream_cache_status;

        # 搜索/写操作不缓存
        set $nocache 0;
        if ($request_method != GET) { set $nocache 1; }
        if ($uri ~* "/search|/fresh|/admin|/login|/message") { set $nocache 1; }
        proxy_no_cache $nocache;

        # 限流: 每 IP 最多 30 请求/秒, 突发 10
        limit_req zone=api_limit burst=10 nodelay;
        limit_req_status 429;
    }

    # 前端静态文件
    root /var/www/flowcapital;
    index index.html;

    location / {
        try_files /index.pre.html /index.html =404;
    }

    # 静态资源强缓存 (30 天)
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    # Service Worker（禁止缓存）
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 安全: 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}

# 限流区域定义
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
