global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "flowcapital-api"
    static_configs:
      - targets: ["localhost:8001"]
    metrics_path: "/metrics"

  - job_name: "flowcapital-scheduler"
    honor_labels: true
    static_configs:
      - targets: ["localhost:9091"]
