<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="经济新闻分析系统" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>经济新闻分析系统</title>
    <style>
      /* 关键 CSS 内联 — 页面骨架即时可见 */
      body{margin:0;background:#0D1117;color:#D5D0C8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
      #root{min-height:100vh}
      .skeleton-bar{background:rgba(255,255,255,0.04);border-radius:4px;height:16px;margin-bottom:8px}
      .skeleton-card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:16px 20px;margin-bottom:8px}
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <!-- 首屏骨架—JS加载后替换 -->
      <div style="max-width:1050px;margin:0 auto;padding:40px 24px">
        <div class="skeleton-bar" style="width:40%;height:24px;margin-bottom:16px"></div>
        <div class="skeleton-bar" style="width:30%"></div>
        <div style="margin-top:40px">
          <div class="skeleton-card"><div class="skeleton-bar" style="width:20%;height:12px;margin-bottom:12px"></div><div class="skeleton-bar" style="width:80%"></div><div class="skeleton-bar" style="width:60%"></div></div>
          <div class="skeleton-card"><div class="skeleton-bar" style="width:20%;height:12px;margin-bottom:12px"></div><div class="skeleton-bar" style="width:70%"></div><div class="skeleton-bar" style="width:50%"></div></div>
          <div class="skeleton-card"><div class="skeleton-bar" style="width:20%;height:12px;margin-bottom:12px"></div><div class="skeleton-bar" style="width:75%"></div><div class="skeleton-bar" style="width:55%"></div></div>
        </div>
      </div>
    </div>
  </body>
</html>
